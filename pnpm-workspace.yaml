ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - docs
  - playground
  - packages/**
  - examples/**

catalogs:
  build:
    "@vitejs/plugin-vue": ^6.0.7
    tsdown: ^0.22.0
    vite: ^8.0.13
  cli:
    "@antfu/ni": ^30.1.0
    bumpp: ^11.1.0
    pncat: ^0.12.0
  frontend:
    "@vue/runtime-core": ^3.5.34
    vue: ^3.5.34
  lint:
    "@antfu/eslint-config": ~9.0.0
    eslint: ^10.4.0
    lint-staged: ^17.0.5
    simple-git-hooks: ^2.13.1
    stylelint: ^17.12.0
    stylelint-config-recess-order: ^7.7.0
    stylelint-order: ^8.1.1
    stylelint-scss: ^7.1.1
  node:
    local-pkg: ^1.2.1
  script:
    esno: ^4.8.0
  style:
    postcss-html: ^1.8.1
    postcss-scss: ^4.0.9
    ress: ^5.0.2
  test:
    vitest: ^4.1.7
  tsc:
    typescript: ~6.0.3
    vue-tsc: ~3.2.9
  types:
    "@types/node": ^24.12.4
  utils:
    es-toolkit: ^1.46.1

allowBuilds:
  esbuild: true
  simple-git-hooks: true