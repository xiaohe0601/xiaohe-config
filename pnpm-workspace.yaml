ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - docs
  - playground
  - packages/**
  - examples/**

catalogs:
  build:
    "@vitejs/plugin-vue": ^6.0.8
    tsdown: ^0.22.14
    vite: ^8.2.2
  cli:
    "@antfu/ni": ^30.5.0
    bumpp: ^12.2.2
    pncat: ^0.13.2
  frontend:
    "@vue/runtime-core": ^3.5.42
    vue: ^3.5.42
  lint:
    "@antfu/eslint-config": ~9.3.0
    eslint: ^10.9.1
    lint-staged: ^17.4.1
    simple-git-hooks: ^2.14.0
    stylelint: ^17.14.1
    stylelint-config-recess-order: ^7.8.0
    stylelint-order: ^8.1.1
    stylelint-scss: ^7.2.0
  node:
    local-pkg: ^1.2.1
  script:
    esno: ^4.8.0
  style:
    postcss-html: ^2.0.0
    postcss-scss: ^4.0.9
    ress: ^6.0.0
  test:
    vitest: ^4.1.11
  tsc:
    typescript: ~6.0.3
    vue-tsc: ~3.3.11
  types:
    "@types/node": ^24.13.3
  utils:
    es-toolkit: ^1.52.0

allowBuilds:
  esbuild: true
  simple-git-hooks: true