shellEmulator: true
trustPolicy: no-downgrade

packages:
  - docs
  - playground
  - packages/**
  - examples/**

catalogs:
  build:
    "@vitejs/plugin-vue": ^6.0.5
    tsdown: ^0.21.4
    vite: ^8.0.1
  cli:
    "@antfu/ni": ^29.0.0
    bumpp: ^11.0.1
    pncat: ^0.11.0
  frontend:
    "@vue/runtime-core": ^3.5.30
    vue: ^3.5.30
  lint:
    "@antfu/eslint-config": ~7.7.3
    eslint: ^10.0.3
    lint-staged: ^16.4.0
    simple-git-hooks: ^2.13.1
    stylelint: ^17.5.0
    stylelint-config-recess-order: ^7.7.0
    stylelint-order: ^8.1.1
    stylelint-scss: ^7.0.0
  node:
    local-pkg: ^1.1.2
  script:
    esno: ^4.8.0
  style:
    postcss-html: ^1.8.1
    postcss-scss: ^4.0.9
    ress: ^5.0.2
  test:
    vitest: ^4.1.0
  tsc:
    typescript: ~5.9.3
    vue-tsc: ^3.2.6
  types:
    "@types/node": ^24.12.0
  utils:
    es-toolkit: ^1.45.1

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks