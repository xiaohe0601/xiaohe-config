ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - docs
  - playground
  - packages/**
  - examples/**

catalogs:
  build:
    "@vitejs/plugin-vue": ^6.0.7
    tsdown: ^0.22.3
    vite: ^8.1.0
  cli:
    "@antfu/ni": ^30.2.0
    bumpp: ^11.1.0
    pncat: ^0.12.0
  frontend:
    "@vue/runtime-core": ^3.5.39
    vue: ^3.5.39
  lint:
    "@antfu/eslint-config": ~9.1.0
    eslint: ^10.6.0
    lint-staged: ^17.0.8
    simple-git-hooks: ^2.13.1
    stylelint: ^17.14.0
    stylelint-config-recess-order: ^7.7.0
    stylelint-order: ^8.1.1
    stylelint-scss: ^7.2.0
  node:
    local-pkg: ^1.2.1
  script:
    esno: ^4.8.0
  style:
    postcss-html: ^1.8.1
    postcss-scss: ^4.0.9
    ress: ^5.0.2
  test:
    vitest: ^4.1.9
  tsc:
    typescript: ~6.0.3
    vue-tsc: ~3.3.5
  types:
    "@types/node": ^24.13.2
  utils:
    es-toolkit: ^1.49.0

allowBuilds:
  esbuild: true
  simple-git-hooks: true